server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    root /var/www/freqway;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy HearHam API to avoid CORS
    location /api/hearham {
        proxy_pass https://hearham.com/api/repeaters/v1;
        proxy_ssl_server_name on;
        proxy_set_header Host hearham.com;
        proxy_set_header Accept "application/json";
        proxy_cache_valid 200 24h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
