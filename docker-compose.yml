# Example: docker compose up -d
# Then open http://localhost:8080 (change the host port as needed, or put a
# TLS-terminating reverse proxy such as Caddy/Traefik in front of it).
services:
  freqway:
    build: .
    image: freqway:latest
    pull_policy: build   # always build locally; this image is not on a registry
    container_name: freqway
    ports:
      - "${FREQWAY_PORT:-8080}:8080"
    restart: unless-stopped
